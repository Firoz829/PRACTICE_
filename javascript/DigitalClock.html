<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            color: white;
            text-align: center;
        }
        .clock {
            font-size: 3rem;
            background: black;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="clock" id="digitalClock">00:00:00 AM</div>

    <script>
        function updateClock() {
            let now = new Date(); // Get current time
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = hours >= 12 ? "PM" : "AM";

            // Convert 24-hour format to 12-hour format
            hours = hours % 12 || 12;   // reminder 0 aaye ga to 12 update honga nahi to jo reminder hai wahi rahe ga

            // Add leading zeros to minutes and seconds if needed
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            let timeString = `${hours}:${minutes}:${seconds} ${ampm}`;

            document.getElementById("digitalClock").innerText = timeString;
        }

        // Update the clock every second
        setInterval(updateClock, 1000);

        // Call the function once to show the time immediately
        updateClock();
    </script>

</body>
</html>
