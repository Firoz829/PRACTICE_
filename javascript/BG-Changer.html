<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Changer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            transition: background-color 0.5s ease-in-out;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            background: black;
            color: white;
            border-radius: 5px;
            margin-top: 20px;
        }
        .color-code {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Random Color Changer</h1>
        <button onclick="changeColor()">Change Color</button>
        <p class="color-code" id="colorCode">#FFFFFF</p>
    </div>

    <script>
        function getRandomColor() {
            // Generate a random HEX color
            let hex = "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0");
            // 0.12345	2076782	"1fa9ae"	"#1fa9ae" 
            return hex;
        }

        //alternative
        /*let r = Math.floor(Math.random() * 256);
          let g = Math.floor(Math.random() * 256);
          let b = Math.floor(Math.random() * 256);
        let rgb = `rgb(${r}, ${g}, ${b})`;
           console.log(rgb);
*/
        function changeColor() {
            let newColor = getRandomColor(); // Generate a random color
            document.body.style.backgroundColor = newColor; // Change background color
            document.getElementById("colorCode").innerText = newColor; // Display color code
        }
    </script>

</body>
</html>
